<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Une invitation… 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#20101a;
    --bg-deep2:#170b13;
    --bg-panel:#2c1622;
    --panel-line:rgba(201,161,90,.28);
    --gold:#c9a15a;
    --gold-soft:#e4c98a;
    --rose:#e0a3b8;
    --rose-soft:#eec2d1;
    --cream:#f6ecdf;
    --muted:#c8adb9;
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100svh;
    background:
      radial-gradient(circle at 18% 12%, rgba(224,163,184,.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(201,161,90,.10), transparent 50%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-deep2) 100%);
    font-family:'Work Sans', sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:24px 16px;
  }

  .sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .spark{
    position:absolute;
    width:3px;height:3px;
    border-radius:50%;
    background:var(--gold-soft);
    opacity:.5;
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.8; transform:scale(1.6);}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0)), var(--bg-panel);
    border:1px solid var(--panel-line);
    border-radius:22px;
    padding:38px 30px 26px;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.02) inset;
    text-align:center;
  }

  .eyebrow{
    font-family:'Petit Formal Script', cursive;
    font-size:1.5rem;
    color:var(--rose-soft);
    margin:0 0 6px;
    letter-spacing:.02em;
    transition:opacity .3s ease;
  }

  .stage{min-height:230px; display:flex; align-items:center; justify-content:center;}
  .stage > div{width:100%; transition:opacity .3s ease, transform .3s ease;}
  .stage.leaving > div{opacity:0; transform:translateY(6px);}

  .display{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.5rem, 5vw, 1.9rem);
    line-height:1.25;
    margin:0 0 8px;
    color:var(--cream);
  }
  .lede{
    font-size:.92rem;
    color:var(--muted);
    margin:0 0 22px;
    font-weight:300;
  }

  /* --- Step 1 : ask --- */
  .ask-actions{
    position:relative;
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
  }
  .btn{
    font-family:'Work Sans', sans-serif;
    font-size:1rem;
    font-weight:500;
    padding:14px 34px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .5s var(--ease-pop), opacity .5s ease, box-shadow .3s ease, left .35s var(--ease-pop), top .35s var(--ease-pop);
  }
  .btn-yes{
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    color:#2a1a10;
    box-shadow:0 10px 24px -10px rgba(201,161,90,.6);
  }
  .btn-yes:hover{transform:scale(1.05);}
  .btn-yes:focus-visible, .btn-no:focus-visible{outline:2px solid var(--rose-soft); outline-offset:3px;}
  .btn-no{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(200,173,185,.4);
  }
  .no-gone{
    position:absolute;
    bottom:0;
    left:0; right:0;
    text-align:center;
    font-size:.85rem;
    color:var(--muted);
    opacity:0;
    transition:opacity .5s ease;
    font-style:italic;
  }

  /* --- Steps 2-4 : choices --- */
  .options{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .option-card{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(201,161,90,.22);
    background:rgba(255,255,255,.02);
    color:var(--cream);
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease, transform .2s ease;
    font-family:'Work Sans', sans-serif;
  }
  .option-card:hover{border-color:rgba(201,161,90,.55); transform:translateY(-1px);}
  .option-card.selected{
    border-color:var(--gold);
    background:rgba(201,161,90,.10);
    box-shadow:0 0 0 1px rgba(201,161,90,.3) inset;
  }
  .option-icon{font-size:1.3rem; line-height:1;}
  .option-text{display:flex; flex-direction:column; gap:2px;}
  .option-title{font-weight:500; font-size:.98rem;}
  .option-sub{font-size:.8rem; color:var(--muted); font-weight:300;}

  .btn-continue{
    font-family:'Work Sans', sans-serif;
    font-size:.95rem;
    font-weight:500;
    padding:12px 30px;
    border-radius:999px;
    border:none;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    color:#2a1a10;
    cursor:pointer;
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .btn-continue.ready{opacity:1; transform:translateY(0); pointer-events:auto;}
  .btn-continue:disabled{cursor:default;}

  /* --- Step 5 : recap --- */
  .recap-list{
    list-style:none;
    padding:0;
    margin:0 0 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:left;
  }
  .recap-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(201,161,90,.18);
  }
  .recap-icon{font-size:1.2rem;}
  .recap-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); display:block;}
  .recap-value{font-size:.98rem; color:var(--cream); font-weight:500;}
  .signoff{
    font-family:'Petit Formal Script', cursive;
    font-size:1.3rem;
    color:var(--rose-soft);
    margin-top:6px;
  }

  /* --- Vine / bloom progress --- */
  .vine{width:100%; height:34px; margin-top:22px; overflow:visible;}
  .stem{fill:none; stroke:rgba(201,161,90,.35); stroke-width:1.2;}
  .bloom-inner{
    transform:scale(0);
    opacity:0;
    transform-box:fill-box;
    transform-origin:center;
    transition:transform .6s var(--ease-pop), opacity .4s ease;
  }
  .bloom-inner.bloomed{transform:scale(1); opacity:1;}
  .petal{fill:var(--rose);}
  .bud:nth-child(odd) .petal{fill:var(--gold-soft);}
  .flower-center{fill:var(--cream); opacity:.85;}

  .petal-fall{
    position:fixed;
    top:-20px;
    font-size:1rem;
    pointer-events:none;
    z-index:2;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
  }

  @media (max-width:380px){
    .card{padding:30px 20px 22px;}
  }
</style>
</head>
<body>

<div class="sparkles" id="sparkles"></div>

<main class="card">
  <p class="eyebrow" id="eyebrow">Une invitation</p>
  <div class="stage" id="stage"></div>

  <svg class="vine" viewBox="0 0 320 34" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <path class="stem" d="M8,26 C 80,8 240,8 312,26"/>
    <g transform="translate(86,17)"><g class="bloom-inner bud" id="bud1">
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(0)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(72)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(144)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(216)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(288)"/>
      <circle class="flower-center" r="2.4"/>
    </g></g>
    <g transform="translate(156,11)"><g class="bloom-inner bud" id="bud2">
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(0)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(72)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(144)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(216)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(288)"/>
      <circle class="flower-center" r="2.4"/>
    </g></g>
    <g transform="translate(226,17)"><g class="bloom-inner bud" id="bud3">
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(0)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(72)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(144)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(216)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(288)"/>
      <circle class="flower-center" r="2.4"/>
    </g></g>
    <g transform="translate(298,13)"><g class="bloom-inner bud" id="bud4">
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(0)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(72)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(144)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(216)"/>
      <ellipse class="petal" cx="0" cy="-5" rx="3" ry="5.5" transform="rotate(288)"/>
      <circle class="flower-center" r="2.4"/>
    </g></g>
  </svg>
</main>

<script>
/* ============================================================
   PERSONNALISATION — modifie librement les valeurs ci-dessous
   ============================================================ */
const CONFIG = {
  // Laisse vide "" si tu ne veux pas afficher de prénom
  partnerName: "",

  dates: [
    { id:"ven", label:"Vendredi", sub:"19h00" },
    { id:"sam", label:"Samedi",   sub:"13h00" },
    { id:"dim", label:"Dimanche", sub:"18h30" }
  ],
  lieux: [
    { id:"resto",  icon:"🍷", label:"Restaurant",   sub:"Vue sur la ville" },
    { id:"parc",   icon:"🌇", label:"Pique-nique",  sub:"Au parc, coucher de soleil" },
    { id:"mer",    icon:"🌊", label:"Bord de mer",  sub:"Balade + terrasse" }
  ],
  repas: [
    { id:"ita",  icon:"🍝", label:"Italien",        sub:"Pâtes & tiramisu" },
    { id:"jap",  icon:"🍱", label:"Japonais",       sub:"Sushis & ramen" },
    { id:"local",icon:"🍲", label:"Cuisine locale", sub:"Saveurs du pays" },
    { id:"surp", icon:"🎁", label:"Surprise",       sub:"Tu choisis sur place" }
  ]
};
/* ============================================================ */

const stage = document.getElementById("stage");
const eyebrow = document.getElementById("eyebrow");
const state = { date:null, lieu:null, repas:null };
let step = "ask";

function findById(list, id){ return list.find(x => x.id === id); }

function renderOptions(list){
  return list.map(o => `
    <button class="option-card" data-id="${o.id}">
      ${o.icon ? `<span class="option-icon">${o.icon}</span>` : ""}
      <span class="option-text">
        <span class="option-title">${o.label}</span>
        <span class="option-sub">${o.sub}</span>
      </span>
    </button>`).join("");
}

const templates = {
  ask: () => `
    <div>
      <h1 class="display">${CONFIG.partnerName ? CONFIG.partnerName + ", veux-tu" : "Veux-tu"} sortir avec moi ?</h1>
      <p class="lede">(il n'y a qu'une seule vraie réponse ici…)</p>
      <div class="ask-actions" id="askActions">
        <button class="btn btn-yes" id="btnOui">Oui</button>
        <button class="btn btn-no" id="btnNon">Non</button>
        <p class="no-gone" id="noGone">le "non" a définitivement quitté le chat 😌</p>
      </div>
    </div>`,
  date: () => `
    <div>
      <h1 class="display">Quel jour te ferait plaisir ?</h1>
      <p class="lede">Choisis un moment, je m'adapte à toi.</p>
      <div class="options">${renderOptions(CONFIG.dates)}</div>
      <button class="btn-continue" disabled>Continuer</button>
    </div>`,
  lieu: () => `
    <div>
      <h1 class="display">Et pour le décor ?</h1>
      <p class="lede">Dis-moi où tu te sentirais bien.</p>
      <div class="options">${renderOptions(CONFIG.lieux)}</div>
      <button class="btn-continue" disabled>Continuer</button>
    </div>`,
  repas: () => `
    <div>
      <h1 class="display">Une envie de quelque chose ?</h1>
      <p class="lede">Le dernier détail, promis.</p>
      <div class="options">${renderOptions(CONFIG.repas)}</div>
      <button class="btn-continue" disabled>Confirmer</button>
    </div>`,
  recap: () => {
    const d = findById(CONFIG.dates, state.date);
    const l = findById(CONFIG.lieux, state.lieu);
    const r = findById(CONFIG.repas, state.repas);
    return `
    <div>
      <h1 class="display">C'est noté 💌</h1>
      <p class="lede">Voici notre rendez-vous.</p>
      <ul class="recap-list">
        <li><span class="recap-icon">📅</span><span><span class="recap-label">Quand</span><span class="recap-value">${d.label} · ${d.sub}</span></span></li>
        <li><span class="recap-icon">${l.icon}</span><span><span class="recap-label">Où</span><span class="recap-value">${l.label} — ${l.sub}</span></span></li>
        <li><span class="recap-icon">${r.icon}</span><span><span class="recap-label">Au menu</span><span class="recap-value">${r.label}</span></span></li>
      </ul>
      <p class="signoff">À très vite.</p>
    </div>`;
  }
};

const eyebrows = { ask:"Une invitation", date:"Étape 1", lieu:"Étape 2", repas:"Étape 3", recap:"Rendez-vous confirmé" };
const budOrder = ["date","lieu","repas","recap"];

function bloomUpTo(currentStep){
  const idx = budOrder.indexOf(currentStep);
  budOrder.forEach((key, i) => {
    const bud = document.getElementById("bud" + (i+1));
    if(!bud) return;
    if(i <= idx) bud.classList.add("bloomed");
    else bud.classList.remove("bloomed");
  });
}

function goTo(next){
  stage.classList.add("leaving");
  setTimeout(() => {
    stage.innerHTML = templates[next]();
    eyebrow.textContent = eyebrows[next];
    step = next;
    stage.classList.remove("leaving");
    bloomUpTo(next);
    if(next === "ask") bindAsk();
    if(next === "recap") launchPetals();
  }, 260);
}

function bindAsk(){
  const btnOui = document.getElementById("btnOui");
  const btnNon = document.getElementById("btnNon");
  const askActions = document.getElementById("askActions");
  const noGone = document.getElementById("noGone");
  const taunts = ["Non","Sûr ?","Vraiment ?","Tu hésites ?","Allez…","S'il te plaît 🥺","Juste… non 😏"];
  let dodgeCount = 0;

  function dodge(){
    const rect = askActions.getBoundingClientRect();
    const btnRect = btnNon.getBoundingClientRect();
    const maxX = Math.max(rect.width - btnRect.width, 0);
    const maxY = Math.max(rect.height - btnRect.height, 0);
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    btnNon.style.position = "absolute";
    btnNon.style.left = x + "px";
    btnNon.style.top = y + "px";
    dodgeCount++;
    if(dodgeCount < taunts.length){
      btnNon.textContent = taunts[dodgeCount];
    }
    const scale = Math.max(1 - dodgeCount * 0.08, 0.45);
    btnNon.style.transform = `scale(${scale})`;
    if(dodgeCount >= taunts.length + 1){
      btnNon.style.opacity = "0";
      btnNon.style.pointerEvents = "none";
      setTimeout(() => {
        btnNon.style.display = "none";
        noGone.style.opacity = "1";
      }, 450);
    }
  }

  btnNon.addEventListener("pointerenter", dodge);
  btnNon.addEventListener("click", (e) => { e.preventDefault(); dodge(); });
  btnNon.addEventListener("touchstart", (e) => { e.preventDefault(); dodge(); }, { passive:false });
  btnOui.addEventListener("click", () => goTo("date"));
}

stage.addEventListener("click", (e) => {
  const card = e.target.closest(".option-card");
  if(card){
    const group = card.parentElement;
    group.querySelectorAll(".option-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
    state[step] = card.dataset.id;
    const cont = stage.querySelector(".btn-continue");
    cont.disabled = false;
    cont.classList.add("ready");
    return;
  }
  const cont = e.target.closest(".btn-continue.ready");
  if(cont){
    if(step === "date") goTo("lieu");
    else if(step === "lieu") goTo("repas");
    else if(step === "repas") goTo("recap");
  }
});

function launchPetals(){
  const emojis = ["🌸","✨","💛"];
  for(let i=0; i<18; i++){
    setTimeout(() => {
      const p = document.createElement("div");
      p.className = "petal-fall";
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = Math.random()*100 + "vw";
      p.style.animationDuration = (3 + Math.random()*2.5) + "s";
      p.style.fontSize = (0.8 + Math.random()*0.8) + "rem";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }, i * 140);
  }
}

function initSparkles(){
  const wrap = document.getElementById("sparkles");
  for(let i=0; i<28; i++){
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = Math.random()*100 + "vw";
    s.style.top = Math.random()*100 + "vh";
    s.style.animationDelay = (Math.random()*5) + "s";
    wrap.appendChild(s);
  }
}

initSparkles();
goTo("ask");
</script>
</body>
</html>
